[project]
name = "pagerduty"
version = "7.0.1"
description = "Clients for PagerDuty's Public APIs"
requires-python = ">=3.10"
dependencies = ["httpx2"]
maintainers = [
  {name = "Demitri Morgan", email = "demitri@pagerduty.com"},
  {name = "PagerDuty Community Team", email = "community-team@pagerduty.com"}
]

[project.scripts]
pagerduty = "pagerduty.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pagerduty"]

[project.urls]
Documentation = "https://pagerduty.github.io/python-pagerduty"
Repository =  "https://github.com/PagerDuty/python-pagerduty"
PyPI = "https://pypi.org/project/pagerduty"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "sphinx",
    "sphinxcontrib-websupport",
    "sphinx-rtd-theme",
    "twine",
    "virtualenv",
]

[tool.ruff]
# Set the maximum line length to 79
line-length = 79

[tool.ruff.lint]
ignore = [
  "E731", # In the author's opinion it is sometimes clearer to assign lambdas to variables than define nested functions
  "TRY004", # TODO: changing ValueError -> TypeError would be a breaking change (it breaks downstream exception handling) so it is left for a future major version update
  "RUF012", # TODO: getter/setter/etc for ApiClient.retry
  "UP031", # TODO: switch to format strings everywhere now that they are fully supported in all Python versions
  "DTZ007", # This rule misfires (pagerduty.common.DATETIME_FMT DOES in fact contain %z despite the warning)
  "YTT204", # TODO: for Python 4 compatibility (comparison in pagerduty.version.get_version)
]

[tool.uv.build-backend]
module-name="pagerduty"
module-root=""
